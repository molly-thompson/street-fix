name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-dummy-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DATABASE_URL: postgres://streetfix:streetfix@localhost:5432/streetfix
      CLOUDINARY_URL: cloudinary://<your_api_key>:<your_api_secret>@<your_cloud_name>

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: streetfix
          POSTGRES_USER: streetfix
          POSTGRES_PASSWORD: streetfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streetfix -d streetfix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check linting
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check typing
        run: uv run mypy .
      
      - name: Run migrations
        run: uv run python manage.py migrate

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput

      - name: Run tests
        run: uv run pytest
